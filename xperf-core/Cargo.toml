[package]
name = "xperf-core"
version = "0.1.5"
edition = "2021"

[lib]
name = "xperf_core"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
tokio = { version = "1.0", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "2.0"
