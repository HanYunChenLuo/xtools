[package]
name = "xperf-core"
version.workspace = true
edition = "2021"

[lib]
name = "xperf_core"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
tokio = { version = "1.0", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "1.0"
colored = "2.0"
libc = "0.2"
tar = "0.4"
flate2 = "1.0"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "rustls-tls",
    "multipart",
    "json",
] }
