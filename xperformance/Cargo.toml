[package]
name = "xperformance"
version = "0.1.5"
edition = "2021"

[[bin]]
name = "xperformance"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
tokio = { version = "1.0", features = ["full"] }
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
colored = "2.0"
ctrlc = "3.4"
plotters = "0.3"
