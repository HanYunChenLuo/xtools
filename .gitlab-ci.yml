release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  script:
    - echo "Creating release ${CI_COMMIT_TAG}"
  release:
    name: "Release $CI_COMMIT_TAG"
    description: |
      XTools Release $CI_COMMIT_TAG

      ## Changes
      <!-- Replace this with the actual changelog for this version -->
      - Improved memory usage reporting
      - Enhanced thread monitoring
      - High-resolution charts (1920x1080)
      - Absolute time-based sampling for consistent intervals

      ## Downloads
      - [Linux x86_64](${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/artifacts/xtools-linux-x86_64.tar.gz?job=build:linux) (Ubuntu 20.04+ compatible)
      # - [macOS x86_64](${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/artifacts/xtools-macos-x86_64.tar.gz?job=build:macos-x86_64) (macOS 11.0+ Intel)
      # - [macOS ARM64](${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/artifacts/xtools-macos-arm64.tar.gz?job=build:macos-arm64) (macOS 11.0+ Apple Silicon)
    tag_name: "$CI_COMMIT_TAG"
    assets:
      links:
        - name: "Linux x86_64"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/artifacts/xtools-linux-x86_64.tar.gz?job=build:linux"
          link_type: "package"
        # - name: "macOS x86_64"
        #   url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/artifacts/xtools-macos-x86_64.tar.gz?job=build:macos-x86_64"
