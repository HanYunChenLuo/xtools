# 探测流水线（临时文件，验证后替换为正式 CI）：
#   1) artifactory 镜像源拉取（ubuntu:20.04 / rust:1.93.0）
#   2) apt 软件源可达性（ubuntu archive + rust 镜像的 debian archive）
#   3) crates.io 依赖拉取 + CLI Linux 构建（端到端）
#   4) release-cli 官方镜像（registry.gitlab.com）是否可拉
#   5) dl.google.com NDK zip 可达性
# 全部 job 并行、无条件执行。

stages:
  - probe

probe:ubuntu-artifactory:
  stage: probe
  image: artifactory.ep.chehejia.com/docker-remote/library/ubuntu:20.04
  script:
    - head -2 /etc/os-release
    - apt-get update -qq && apt-get install -y -qq curl build-essential pkg-config ca-certificates libfontconfig1-dev
    - curl --version | head -1

probe:rust-cli-build:
  stage: probe
  image: artifactory.ep.chehejia.com/docker-remote/library/rust:1.93.0
  variables:
    CARGO_HOME: $CI_PROJECT_DIR/.cargo
  script:
    - rustc --version
    - apt-get update -qq && apt-get install -y -qq pkg-config libfontconfig1-dev
    - cargo build --release -p xperf-cli
    - ls -lh target/release/xperf-cli

probe:release-cli-image:
  stage: probe
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  script:
    - release-cli --version

probe:ndk-egress:
  stage: probe
  image: artifactory.ep.chehejia.com/docker-remote/library/ubuntu:20.04
  script:
    - apt-get update -qq && apt-get install -y -qq curl ca-certificates
    - curl -sI -m 20 https://dl.google.com/android/repository/android-ndk-r25b-linux.zip | head -6
