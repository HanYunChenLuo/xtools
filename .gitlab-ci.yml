image: ubuntu:20.04

variables:
  CARGO_HOME: $CI_PROJECT_DIR/.cargo
  DEBIAN_FRONTEND: noninteractive
  MACOSX_DEPLOYMENT_TARGET: "11.0"

stages:
  - validate
  - test
  - build
  - release

# Cache dependencies and build artifacts
cache:
  paths:
    - target/
    - .cargo/
  key: $CI_COMMIT_REF_SLUG

.rust-setup: &rust-setup
  # Install SSL certificates for Rust installer
  - apt-get update && apt-get install -y curl build-essential pkg-config ca-certificates libfontconfig1-dev
  - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
  - source $CARGO_HOME/env

# Validate tag format (x.y.z)
validate:tag:
  stage: validate
  script:
    - |
      if [[ ! "$CI_COMMIT_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
        echo "Invalid tag format! Tags must follow semantic versioning (x.y.z or vx.y.z)"
        exit 1
      fi
      echo "Tag format is valid: $CI_COMMIT_TAG"
  rules:
    - if: $CI_COMMIT_TAG

build:linux:
  stage: build
  script:
    - *rust-setup
    - rustc --version
    - cargo --version
    - cargo build --release --target x86_64-unknown-linux-gnu
    # Create artifacts directory
    - mkdir -p artifacts
    # Copy binary and documentation
    - cp target/x86_64-unknown-linux-gnu/release/xperformance artifacts/
    - cp README.md artifacts/
    - cp README_zh.md artifacts/
    - cp LICENSE artifacts/
    # Create archive
    - cd artifacts
    - tar -czf xtools-linux-x86_64.tar.gz *
  artifacts:
    paths:
      - artifacts/xtools-linux-x86_64.tar.gz
    expire_in: never
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG

