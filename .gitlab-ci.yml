# 探测流水线 #2（临时文件）：runner 侧 apt 走 aliyun 镜像重写后的可达性/速度。
# 结论 #1：artifactory 镜像拉取 ✅ / dl.google.com ✅ / registry.gitlab.com ✅ /
#          archive.ubuntu.com + deb.debian.org 直连不可用（apt 卡死 15min+）。

stages:
  - probe

probe:ubuntu-aliyun:
  stage: probe
  image: artifactory.ep.chehejia.com/docker-remote/library/ubuntu:20.04
  script:
    - sed -i 's|archive.ubuntu.com|mirrors.aliyun.com|g; s|security.ubuntu.com|mirrors.aliyun.com|g' /etc/apt/sources.list
    - time apt-get update -qq
    - time apt-get install -y -qq pkg-config libfontconfig1-dev
    - pkg-config --modversion fontconfig

probe:rust-bullseye-aliyun:
  stage: probe
  image: artifactory.ep.chehejia.com/docker-remote/library/rust:1.93.0-bullseye
  script:
    - sed -i 's|deb.debian.org|mirrors.aliyun.com|g; s|security.debian.org|mirrors.aliyun.com|g' /etc/apt/sources.list
    - time apt-get update -qq
    - time apt-get install -y -qq pkg-config libfontconfig1-dev
    - pkg-config --modversion fontconfig
    - echo "tools:"; for t in unzip python3 busybox curl git; do command -v $t || echo "  $t MISSING"; done
